<!DOCTYPE html>
<html>
<head>
  <title>Experiment 2c - Registration Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding-top: 60px; padding-left: 20px; }
    table { background-color: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
    td { padding: 8px; }
    .btn { padding: 8px 15px; margin-right: 10px; cursor: pointer; }
  </style>
</head>
<body>
<!-- Experiment 2, Question c: Registration form inside a table -->
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>A stalin</strong><br>
  Reg No: 24K61A1201S
</div>

<h2>Student Registration Form</h2>

<form action="#" method="post">
  <table>
    <tr>
      <td><label for="name">Full Name:</label></td>
      <td><input type="text" id="name" name="name" required></td>
    </tr>
    <tr>
      <td><label for="pwd">Password:</label></td>
      <td><input type="password" id="pwd" name="pwd" required></td>
    </tr>
    <tr>
      <td><label for="phone">Phone Number:</label></td>
      <td><input type="number" id="phone" name="phone"></td>
    </tr>
    <tr>
      <td><label for="dob">Date of Birth:</label></td>
      <td><input type="date" id="dob" name="dob"></td>
    </tr>
    <tr>
      <td><label>Gender:</label></td>
      <td>
        <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label>
      </td>
    </tr>
    <tr>
      <td><label>Hobbies:</label></td>
      <td>
        <input type="checkbox" id="reading" name="hobbies" value="reading"> <label for="reading">Reading</label>
        <input type="checkbox" id="sports" name="hobbies" value="sports"> <label for="sports">Sports</label>
        <input type="checkbox" id="music" name="hobbies" value="music"> <label for="music">Music</label>
      </td>
    </tr>
    <tr>
      <td><label for="state">State:</label></td>
      <td>
        <select id="state" name="state">
          <option value="">Select State</option>
          <option value="ap">Andhra Pradesh</option>
          <option value="tg">Telangana</option>
          <option value="ka">Karnataka</option>
          <option value="tn">Tamil Nadu</option>
        </select>
      </td>
    </tr>
    <tr>
      <td><label for="address">Address:</label></td>
      <td><textarea id="address" name="address" rows="4" cols="30"></textarea></td>
    </tr>
    <tr>
      <td colspan="2" style="text-align: center; padding-top: 15px;">
        <input type="submit" value="Submit" class="btn">
        <input type="reset" value="Reset" class="btn">
      </td>
    </tr>
  </table>
</form>

</body>
</html>
