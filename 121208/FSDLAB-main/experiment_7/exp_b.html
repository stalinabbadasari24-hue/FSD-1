<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Object Properties and Methods</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; padding-top: 60px; line-height: 1.6; }
        h1 { color: #333; }
        .output { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 4px; margin-top: 10px; }
        table { border-collapse: collapse; width: 50%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>A stalin</strong><br>
  Reg No: 24K61A1201
</div>
    <!-- Experiment 7b: Window Object -->
    <h1>Window Object Properties and Methods</h1>
    <button onclick="showAlert()">Alert</button>
    <button onclick="openWindow()">Open New Window</button>
    <div id="output" class="output"></div>
    <script>
        document.getElementById("output").innerHTML = `
            <p><b>window.innerWidth:</b> ${window.innerWidth}</p>
            <p><b>window.innerHeight:</b> ${window.innerHeight}</p>
            <p><b>window.location.href:</b> ${window.location.href}</p>
        `;
        function showAlert() {
            window.alert("This is a window.alert!");
        }
        function openWindow() {
            window.open("https://example.com", "_blank", "width=400,height=300");
        }
    </script>
</body>
</html>
