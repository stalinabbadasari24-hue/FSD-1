<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 9C - Form Validation</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 60px 20px 20px; line-height: 1.6; }
        .container { max-width: 450px; margin: 0 auto; background: #f9f9f9; padding: 25px; border-radius: 8px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .error { color: red; font-size: 0.85em; margin-top: 5px; display: none; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; }
        button:hover { background: #218838; }
        .success { color: green; font-weight: bold; text-align: center; display: none; margin-top: 15px; }
    </style>
</head>
<body>
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>K H N V Phani Kumar</strong><br>
  Reg No: 24K61A1259
</div>

<!-- Experiment 9c: Form validation with Regex -->
<div class="container">
    <h2 style="text-align:center; margin-top:0;">Registration Form</h2>
    <form id="regForm">
        <div class="form-group">
            <label for="username">Name</label>
            <input type="text" id="username" placeholder="Starts with letter, min 6 chars">
            <div class="error" id="nameError">Name must start with a letter and have at least 6 alphanumeric characters.</div>
        </div>
        
        <div class="form-group">
            <label for="mobile">Mobile Number</label>
            <input type="text" id="mobile" placeholder="10 digit number">
            <div class="error" id="mobileError">Mobile must be exactly 10 digits.</div>
        </div>
        
        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" id="email" placeholder="example@domain.com">
            <div class="error" id="emailError">Please enter a valid email address.</div>
        </div>
        
        <button type="submit">Submit</button>
        <div class="success" id="successMsg">Form submitted successfully!</div>
    </form>
</div>

<script>
    document.getElementById('regForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Prevent submission by default for validation
        
        let isValid = true;
        
        // 1. Name Validation: Start with letter, alphanumeric, min length 6
        let nameField = document.getElementById('username');
        let nameError = document.getElementById('nameError');
        let nameRegex = /^[A-Za-z][A-Za-z0-9]{5,}$/;
        if (!nameRegex.test(nameField.value)) {
            nameError.style.display = 'block';
            isValid = false;
        } else {
            nameError.style.display = 'none';
        }
        
        // 2. Mobile Validation: Exactly 10 digits
        let mobileField = document.getElementById('mobile');
        let mobileError = document.getElementById('mobileError');
        let mobileRegex = /^[0-9]{10}$/;
        if (!mobileRegex.test(mobileField.value)) {
            mobileError.style.display = 'block';
            isValid = false;
        } else {
            mobileError.style.display = 'none';
        }
        
        // 3. Email Validation
        let emailField = document.getElementById('email');
        let emailError = document.getElementById('emailError');
        let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailField.value)) {
            emailError.style.display = 'block';
            isValid = false;
        } else {
            emailError.style.display = 'none';
        }
        
        let successMsg = document.getElementById('successMsg');
        if (isValid) {
            successMsg.style.display = 'block';
            // Here you would typically allow actual submission or do an AJAX request.
            // For now, it stays on page to show success message.
        } else {
            successMsg.style.display = 'none';
        }
    });
</script>
</body>
</html>
