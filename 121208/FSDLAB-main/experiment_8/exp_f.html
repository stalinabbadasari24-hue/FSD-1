<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 8F - Denomination Breakdown</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 60px 20px 20px; line-height: 1.6; }
        .container { max-width: 500px; margin: 0 auto; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        input[type="number"] { width: 100%; padding: 8px; margin-bottom: 15px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #6f42c1; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #5a32a3; }
        #result { margin-top: 20px; font-size: 1.1em; color: #333; line-height: 1.8; }
        .deno-item { background: #fff; padding: 5px 10px; border: 1px solid #ccc; display: inline-block; margin: 5px; border-radius: 4px;}
    </style>
</head>
<body>
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>K H N V Phani Kumar</strong><br>
  Reg No: 24K61A1259
</div>

<!-- Experiment 8f: Denomination breakdown -->
<div class="container">
    <h2>Denomination Breakdown</h2>
    <label for="amount">Deposit Amount:</label>
    <input type="number" id="amount" placeholder="Enter amount (e.g. 163)">
    
    <button onclick="calculateDenominations()">Calculate Notes</button>

    <div id="result"></div>
</div>

<script>
    function calculateDenominations() {
        let amount = parseInt(document.getElementById('amount').value);
        let resultDiv = document.getElementById('result');

        if (isNaN(amount) || amount <= 0) {
            resultDiv.innerHTML = "<span style='color:red;'>Please enter a valid positive amount.</span>";
            return;
        }

        let denominations = [100, 50, 20, 10, 5, 2, 1];
        let counts = {};
        
        let remaining = amount;
        for (let i = 0; i < denominations.length; i++) {
            let note = denominations[i];
            if (remaining >= note) {
                counts[note] = Math.floor(remaining / note);
                remaining = remaining % note;
            }
        }

        let output = `<b>Amount: ${amount}</b><br><br>`;
        for (let i = 0; i < denominations.length; i++) {
            let note = denominations[i];
            if (counts[note]) {
                output += `<span class="deno-item">${counts[note]} &times; ${note}</span>`;
            }
        }

        resultDiv.innerHTML = output;
    }
</script>
</body>
</html>
