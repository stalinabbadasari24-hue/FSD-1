<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 8A - Largest of Three Numbers</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 60px 20px 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 0 auto; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #333; }
    </style>
</head>
<body>
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>K H N V Phani Kumar</strong><br>
  Reg No: 24K61A1259
</div>

<!-- Experiment 8a: Largest of three integers -->
<div class="container">
    <h2>Find Largest Number</h2>
    <div class="form-group">
        <label for="num1">First Number:</label>
        <input type="number" id="num1" placeholder="Enter first integer">
    </div>
    <div class="form-group">
        <label for="num2">Second Number:</label>
        <input type="number" id="num2" placeholder="Enter second integer">
    </div>
    <div class="form-group">
        <label for="num3">Third Number:</label>
        <input type="number" id="num3" placeholder="Enter third integer">
    </div>
    <button onclick="findLargest()">Find Largest</button>

    <div id="result"></div>
</div>

<script>
    function findLargest() {
        var n1 = parseInt(document.getElementById('num1').value);
        var n2 = parseInt(document.getElementById('num2').value);
        var n3 = parseInt(document.getElementById('num3').value);
        var resultDiv = document.getElementById('result');

        if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
            resultDiv.innerHTML = "<span style='color:red;'>Please enter valid integers in all fields.</span>";
            return;
        }

        if (n1 === n2 && n2 === n3) {
            resultDiv.innerHTML = "EQUAL NUMBERS";
        } else {
            var largest = Math.max(n1, n2, n3);
            resultDiv.innerHTML = largest + " LARGER NUMBER";
        }
    }
</script>
</body>
</html>
