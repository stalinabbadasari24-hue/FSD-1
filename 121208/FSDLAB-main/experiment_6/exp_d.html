<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Eligibility</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; padding-top: 60px; line-height: 1.6; }
        h1 { color: #333; }
        .output { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; border-radius: 4px; margin-top: 10px; }
        table { border-collapse: collapse; width: 50%; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
<div style="position:fixed; top:8px; left:8px; background:#f2f2f2; border:1px solid #999; padding:6px 10px; font-family:Arial, sans-serif; font-size:13px; z-index:9999; border-radius:4px;">
  <strong>A stalin</strong><br>
  Reg No: 24K61A1201
</div>
    <!-- Experiment 6d: Voter form using prompt -->
    <h1>Voter Eligibility</h1>
    <p>Click the button to check voting eligibility.</p>
    <button onclick="checkEligibility()">Check Eligibility</button>
    <div id="result"></div>

    <script>
        function checkEligibility() {
            let name = prompt("Enter your name:");
            if (!name) return;
            
            let ageStr = prompt("Enter your age:");
            if (!ageStr) return;
            
            let age = Number(ageStr);
            let status = (age >= 18) ? "Can Vote" : "Cannot Vote";
            
            let table = "<table>";
            table += "<tr><th>Name</th><th>Age</th><th>Eligibility</th></tr>";
            table += "<tr><td>" + name + "</td><td>" + age + "</td><td>" + status + "</td></tr>";
            table += "</table>";
            
            document.getElementById("result").innerHTML = table;
        }
    </script>
</body>
</html>
